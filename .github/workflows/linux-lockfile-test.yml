name: Linux Lockfile Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate lockfile
        run: npm install --include=optional

      - name: Check emnapi
        run: npm ls @emnapi/runtime || true

      - name: Test npm ci
        run: npm ci
