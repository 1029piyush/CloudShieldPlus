name: CloudIntercept CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            1029piyush/cloudintercept-backend:latest
            1029piyush/cloudintercept-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          no-cache: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            1029piyush/cloudintercept-frontend:latest
            1029piyush/cloudintercept-frontend:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: build-and-publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/CloudShieldPlus

            echo "Updating deployment configuration..."
            git fetch origin main
            git reset --hard origin/main

            echo "Pulling exact Docker images for commit..."
            docker pull 1029piyush/cloudintercept-backend:${{ github.sha }}
            docker pull 1029piyush/cloudintercept-frontend:${{ github.sha }}

            echo "Starting CloudIntercept..."
            IMAGE_TAG=${{ github.sha }} docker compose up -d

            echo "Waiting for services..."
            sleep 15

            echo "Checking containers..."
            docker compose ps

            echo "Checking backend health..."
            docker compose exec -T backend curl -f http://localhost:5000/health

            echo "Checking frontend Nginx..."
            docker compose exec -T frontend nginx -t

            echo "Checking HTTPS application..."
            curl -f https://cloudintercept.sbs/ || exit 1

            echo "Deployment successful."
