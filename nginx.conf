server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Use Docker/cloud DNS resolver - defers upstream resolution to request time
    # This prevents "host not found" crash when backend isn't up yet at nginx start
    resolver 127.0.0.11 8.8.8.8 valid=10s ipv6=off;

    # Backend URL - defaults to docker-compose service name, overridden by env var in cloud
    set $backend_url "http://backend:5000";

    # index.html - never cache
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    # SPA routing
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    # Scan endpoint - long timeout for AWS scans
    location /api/scans {
        proxy_pass $backend_url/api/scans;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
    }

    # All other API requests
    location /api/ {
        proxy_pass $backend_url/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # Hashed JS/CSS - cache forever (Vite adds hash on every build)
    location ~* \.(?:css|js)$ {
        root /usr/share/nginx/html;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Other static assets
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|mp4|ogg|webm)$ {
        root /usr/share/nginx/html;
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }
}